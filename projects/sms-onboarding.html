// ── LegalDisclaimerModal ──────────────────────────────────────────────────────
function LegalDisclaimerModal({ doc, onAgree, onDecline }) {
  const isPrivacy = doc === 'privacy'
  const title  = isPrivacy ? 'SMS Privacy Policy Template' : 'SMS Terms & Conditions Template'
  const thing  = isPrivacy ? 'privacy policy' : 'terms and conditions'
  const sample = isPrivacy ? 'Sample Policy' : 'Sample Terms'
  return createPortal(
    <div className="fixed inset-0 z-[80] flex items-center justify-center bg-black/40 px-4 font-sans">
      <div className="w-full max-w-[560px] overflow-hidden rounded-[16px] bg-white shadow-[0_24px_70px_rgba(0,0,0,0.25)]">
        <div className="border-b border-[#f0ede9] px-[28px] py-[16px] text-center"><p className="text-[15px] font-semibold text-[#1f1f1f]">Legal disclaimer</p></div>
        <div className="max-h-[60vh] overflow-y-auto px-[28px] py-[24px]">
          <h3 className="mb-[16px] text-[18px] font-bold text-[#1f1f1f]">{title}</h3>
          <p className="mb-[14px] text-[14px] leading-[1.65] text-[#4b4b4b]">We're happy to provide a template {thing} (&ldquo;{sample}&rdquo;) for you to customize for your SMS program, if you choose to use one.</p>
          <p className="mb-[14px] text-[14px] leading-[1.65] text-[#4b4b4b]">If you use or access this {sample}, you acknowledge the following:</p>
          <p className="text-[14px] leading-[1.65] text-[#4b4b4b]">The {sample} has not been prepared specifically for you, and you should review and customize it to fit your particular circumstances and local legal and regulatory requirements. The {sample} is provided for informational purposes only, does not constitute legal advice, and may not be legally suitable for use in your jurisdiction. You should not rely upon or use the {sample} or any information contained therein for any purpose without seeking legal advice from a licensed attorney. Shopcord expressly disclaims all liability in respect to any actions taken or not taken based on any or all of the contents of the {sample}. For more information, please see <a className="font-medium text-[#e11d74] hover:underline">Shopcord&rsquo;s Terms of Use</a>.</p>
        </div>
        <div className="flex items-center justify-end gap-[10px] border-t border-[#f0ede9] px-[28px] py-[16px]">
          <button onClick={onDecline} className="rounded-[8px] border border-[#e4e4e7] px-[18px] py-[9px] text-[13px] font-medium text-[#6b6b6b] transition-colors hover:bg-[#f9f8f7]">Decline</button>
          <button onClick={onAgree} className="rounded-[8px] bg-[#e11d74] px-[22px] py-[9px] text-[13px] font-semibold text-white transition-[filter] hover:brightness-95">I agree</button>

}

                  <div className="mt-7"><button onClick={goNext} className="rounded-[8px] bg-[#e11d74] px-6 py-2.5 text-[13px] font-semibold text-white transition-[filter] hover:brightness-95">Continue</button></div>

              {key === 'summary' && (

                  <section className="border-t border-[#ece7e0] pt-5">

                      <SummaryRow label="Phone Number" value={phone} />
                      <SummaryRow label="Legal Entity Name" value={BUSINESS_IDENTITY.legalEntity} />
                      <SummaryRow label="Business Type" value={businessType} />
                      <SummaryRow label="Website URL" value={website} />
                    </dl>
                  </section>
                  <section className="mt-6 border-t border-[#ece7e0] pt-5">
                    <p className="mb-4 text-[13px] font-medium text-[#9c9c9c]">Tell us about your texts</p>
                    <dl className="flex flex-col gap-3">
                      <SummaryRow label="What will you text customers?" value={useCase} clamp />
                      <SummaryRow label="Sample message" value={sample} clamp />
                      <SummaryRow label="How do your customers opt in for texts?" value={optIn} />
                      <SummaryRow label="Link to your sign-up form(s)" value={consentUrl} />
                    </dl>
                  </section>
                  <button onClick={() => setAcknowledged(a => !a)} className="mt-6 flex w-full items-start gap-3 rounded-[8px] border border-[#ece7e0] bg-[#faf9f6] px-4 py-3.5 text-left">
                    <span className={cn('mt-0.5 flex size-[18px] shrink-0 items-center justify-center rounded-[5px] border', acknowledged ? 'border-[#1f1f1f] bg-[#1f1f1f]' : 'border-[#c9c4bd] bg-white')}>{acknowledged && <Check size={12} strokeWidth={3} className="text-white" />}</span>
                    <span className="text-[13px] leading-[1.5] text-[#6b6b6b]">I acknowledge that I will only send messages to contacts who have explicitly opted in to receive SMS from my business. I agree to comply with TCPA regulations, include opt-out instructions in all marketing messages, and honor opt-out requests promptly.</span>
                  </button>
                  <div className="mt-6 flex justify-end gap-3">
                    <button onClick={back} className="rounded-[8px] border border-[#e4e4e7] bg-white px-5 py-2.5 text-[13px] font-medium text-[#6b6b6b] transition-colors hover:border-[#a3a3a3] hover:text-[#1f1f1f]">Back</button>
                    <button onClick={() => acknowledged && setKey('success')} disabled={!acknowledged} className={cn('rounded-[8px] px-6 py-2.5 text-[13px] font-semibold text-white transition-[filter]', acknowledged ? 'bg-[#e11d74] hover:brightness-95' : 'cursor-not-allowed bg-[#f0a9c9]')}>Submit Application</button>
                  </div>
                </Step>
              )}
            </div>
          </div>

          {showPreview && (
            <div className="hidden w-[42%] shrink-0 items-center justify-center border-l border-[#f2ede7] bg-[#f7f7f7] lg:flex">
              <PhonePreview conversation={key === 'usecase'} number={key === 'phone' || key === 'summary' ? selectedPhone : undefined} brand="FASHIONGO" />
            </div>
          )}
        </div>
      </AppFrame>
    )
  }
})()

// HYBRID VARIANT

const SmsOnboardingHybridPage = (() => {

    function go(to) { setHist(h => [...h, key]); setKey(to) }
    function next() { go(nextOf(key)) }

    const stepIdx = ORDER.indexOf(key)
    const total = ORDER.length
    const progressPct = stepIdx >= 0 ? Math.round(((stepIdx + 1) / total) * 100) : 100
    const displayPhones = phoneSearch ? phones.filter(p => phoneDigits(p.number).endsWith(phoneSearch)) : phones
    const refreshPhones = () => { setPhones(randomPhones()); setSelectedPhone(null); setPhoneSearch('') }
    const searchNoResults = phoneSearch.length === 4 && displayPhones.length === 0
    const selectedNumber = MOCK_PHONES.find(p => p.id === selectedPhone)?.number

    const canContinue = (() => {
      switch (key) {
        case 'biz': return bizPage === 0 ? (phone.trim() !== '' && websiteUrl.trim() !== '') : businessType !== ''
        case 'usecase': return useCasePage === 0 ? (useCase.trim() !== '' && sample.trim() !== '') : (optIn !== '' && consentUrl.trim() !== '')
        case 'privacy': return privacyChoice !== ''; case 'terms': return termsChoice !== ''
        case 'phone': return selectedPhone !== null; case 'review': return acknowledged; default: return false
      }

    if (key === 'success') {
      return (
        <ShopcordShell>
          <div className="flex flex-1 items-center justify-center px-6">
            <div className="w-full max-w-[460px] animate-fade-in-up text-center">
              <div className="mx-auto mb-6 flex size-[60px] items-center justify-center rounded-full bg-[#e11d74]"><Check size={28} strokeWidth={2.5} className="text-white" /></div>
              <h1 className="mb-2 text-[26px] font-bold tracking-[-0.3px] text-[#1f1f1f]">You're all set! 🎉</h1>
              <p className="mb-1 text-[15px] leading-[1.6] text-[#6b6b6b]">We've reserved <span className="font-semibold text-[#1f1f1f]">{selectedNumber}</span> for you and sent it off to the carriers for review.</p>
              <p className="mb-8 text-[15px] leading-[1.6] text-[#6b6b6b]">We'll email <span className="font-semibold text-[#1f1f1f]">emma.carter@fashiongo.net</span> the moment it's approved. Hang tight!</p>
              <button onClick={() => navigate('/connect/marketing')} className="mx-auto block h-[52px] w-[220px] rounded-full bg-[#e11d74] text-[15px] font-semibold text-white transition-[filter] hover:brightness-95">Back to Marketing</button>
            </div>
          </div>
        </ShopcordShell>
      )
    }

    const ctaLabel = key === 'review' ? 'Agree & submit' : 'Continue'
    const onCta = () => {
      if (!canContinue) return
      if (key === 'biz' && bizPage === 0) return setBizPage(1)
      if (key === 'usecase' && useCasePage === 0) return setUseCasePage(1)
      key === 'review' ? setKey('success') : next()
    }
    const showSubBack = (key === 'biz' && bizPage === 1) || (key === 'usecase' && useCasePage === 1)
    const onSubBack = () => { if (key === 'biz') setBizPage(0); else setUseCasePage(0) }

    return (
      <ShopcordShell>
        <div className="flex h-full flex-col">
          <div className="flex h-[56px] items-center gap-4 px-6">
            <button onClick={back} className="flex size-9 shrink-0 items-center justify-center rounded-full text-[#1f1f1f] transition-colors hover:bg-black/5" aria-label="Back"><ArrowLeft size={20} /></button>
            <div className="mx-auto flex w-full max-w-[900px] items-center gap-3">

              <span className="shrink-0 text-[13px] font-semibold tabular-nums text-[#a3a3a3]">{stepIdx + 1} / {total}</span>

                    {searchNoResults ? (

                      <div className="flex flex-col gap-2.5">

                          return (<button key={p.id} onClick={() => setSelectedPhone(sel ? null : p.id)} className={cn('flex items-center justify-between rounded-2xl border px-5 py-4 text-left transition-all', sel ? 'border-2 border-[#e11d74] bg-[#fdf2f8]/50' : 'border border-[#e4e4e7] bg-white hover:border-[#a3a3a3]')}><span className={cn('font-mono text-[16px] tracking-[0.5px] text-[#1f1f1f]', sel ? 'font-bold' : 'font-normal')}>{p.number}</span><span className={cn('flex size-5 items-center justify-center rounded-full border', sel ? 'border-[#e11d74] bg-[#e11d74]' : 'border-[#d1ccc6]')}>{sel && <Check size={12} strokeWidth={3} className="text-white" />}</span></button>)
                        })}
                      </div>
                    )}
                  </Step>
                )}

                {key === 'review' && (
                  <Step eyebrow="Last step" title="Review your submission" sub="Please make sure all information is correct.">
                    <div className="rounded-2xl border border-[#e4e4e7] bg-white p-5">
                      <p className="mb-3 text-[11px] font-semibold uppercase tracking-[0.6px] text-[#a3a3a3]">Business information</p>
                      <dl className="divide-y divide-[#f4f0ea]"><Row label="Contact" value={BUSINESS_IDENTITY.contact} /><Row label="Phone Number" value={phone} /><Row label="Legal Entity Name" value={BUSINESS_IDENTITY.legalEntity} /><Row label="Business Type" value={businessType} /><Row label="Website URL" value={websiteUrl} /></dl>
                    </div>
                    <div className="mt-3 rounded-2xl border border-[#e4e4e7] bg-white p-5">
                      <p className="mb-3 text-[11px] font-semibold uppercase tracking-[0.6px] text-[#a3a3a3]">Tell us about your texts</p>
                      <dl className="divide-y divide-[#f4f0ea]"><Row label="What will you text customers?" value={useCase} clamp /><Row label="Sample message" value={sample} clamp /><Row label="How do your customers opt in for texts?" value={optIn} /><Row label="Link to your sign-up form(s)" value={consentUrl} /></dl>
                    </div>
                    <button onClick={() => setAcknowledged(a => !a)} className={cn('mt-3 flex w-full items-start gap-3 rounded-2xl border px-5 py-4 text-left transition-colors', acknowledged ? 'border-[#e11d74] bg-[#fdf2f8]/40' : 'border-[#e4e4e7] bg-white hover:border-[#a3a3a3]')}>
                      <span className={cn('mt-0.5 flex size-5 shrink-0 items-center justify-center rounded-[6px] border', acknowledged ? 'border-[#e11d74] bg-[#e11d74]' : 'border-[#d1ccc6]')}>{acknowledged && <Check size={13} strokeWidth={3} className="text-white" />}</span>
                      <span className="text-[13px] leading-[1.5] text-[#6b6b6b]">I acknowledge that I will only send messages to contacts who have explicitly opted in to receive SMS from my business. I agree to comply with TCPA regulations, include opt-out instructions in all marketing messages, and honor opt-out requests promptly.</span>
                    </button>
                  </Step>
                )}
              </div>

              <div className="hidden lg:block">
                <div className="sticky top-4 rounded-[20px] bg-[#f4f1ec] p-6">
                  <div className="mx-auto flex max-w-[260px] flex-col items-center">
                    <div className="mb-1 flex size-10 items-center justify-center rounded-full bg-[#e0dcd4] text-[13px] font-semibold text-[#7a756c]">F</div>
                    <p className="mb-4 text-[12px] font-medium text-[#8a857e]">{selectedNumber ?? 'FASHIONGO'}</p>
                    <div className="w-full space-y-2">
                      <div className="max-w-[92%] rounded-[16px] rounded-bl-[5px] bg-white px-3.5 py-2.5 text-[12px] leading-[1.5] text-[#1f1f1f] shadow-[0_1px_2px_rgba(0,0,0,0.05)]">{sample?.trim() ? sample : 'New arrivals just dropped 🎉 Shop the latest from FASHIONGO. Reply STOP to opt out.'}</div>
                      <div className="ml-auto max-w-[60%] rounded-[16px] rounded-br-[5px] bg-[#e11d74] px-3.5 py-2.5 text-right text-[12px] text-white">Take me there!</div>
                    </div>
                    <p className="mt-4 text-center text-[11px] leading-[1.5] text-[#b5ada4]">This is how your buyers will see your texts.</p>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <div className="sticky bottom-0 bg-gradient-to-t from-[#fdfcfa] via-[#fdfcfa] to-transparent px-6 pb-6 pt-8">
            <div className="mx-auto flex w-full max-w-[900px] justify-end gap-3">
              {showSubBack && <button onClick={onSubBack} className="h-[50px] rounded-full border border-[#e4e4e7] bg-white px-8 text-[15px] font-medium text-[#6b6b6b] transition-colors hover:border-[#a3a3a3] hover:text-[#1f1f1f]">Back</button>}
              <button onClick={onCta} disabled={!canContinue} className={cn('h-[50px] rounded-full px-10 text-[15px] font-semibold text-white transition-[filter]', canContinue ? 'bg-[#e11d74] hover:brightness-95' : 'cursor-not-allowed bg-[#f6bcd7]')}>{ctaLabel}</button>
            </div>
          </div>
        </div>
      </ShopcordShell>
    )
  }
})()

// LEGAL DOCS CARD (My Account → Company)
// ══════════════════════════════════════════════════════════════════════════════
const LegalDocsCard = (() => {
  const PRIVACY_V3 = `<h2>Privacy Policy</h2><p class="eff">Effective: July 20, 2026</p><h3>Contents</h3><ol><li>About us</li><li>About this privacy policy</li><li>What personal information we collect</li><li>How we use your personal information</li><li>Who we share it with</li><li>Your choices and opt-out</li></ol>`
  const PRIVACY_V2 = `<h2>Privacy Policy</h2><p class="eff">Effective: May 2, 2026</p><h3>Contents</h3><ol><li>About us</li><li>About this privacy policy</li><li>What personal information we collect</li><li>How we use your personal information</li><li>Who we share it with</li></ol>`
  const PRIVACY_V1 = `<h2>Privacy Policy</h2><p class="eff">Effective: January 20, 2026</p><h3>Contents</h3><ol><li>About us</li><li>What personal information we collect</li><li>How we use your personal information</li></ol>`
  const TERMS_V2 = `<p class="eff">FASHIONGO · emma.carter@fashiongo.net</p><h2>Messaging Terms &amp; Conditions</h2><h3>General</h3><p>When you opt in, we'll send a message to confirm your signup.</p><p>By opting into messages, you agree to receive recurring automated marketing texts. Msg &amp; data rates may apply. Reply STOP to opt out, HELP for help.</p>`
  const TERMS_V1 = `<p class="eff">FASHIONGO · emma.carter@fashiongo.net</p><h2>Messaging Terms &amp; Conditions</h2><p>By opting in, you agree to receive recurring automated marketing texts. Msg &amp; data rates may apply. Reply STOP to opt out.</p>`
  const INITIAL_DOCS = [
    { key: 'privacy', title: 'Privacy Policy', source: 'created', versions: [
      { version: 3, date: 'Jul 20, 2026', contentHtml: PRIVACY_V3 }, { version: 2, date: 'May 2, 2026', contentHtml: PRIVACY_V2 }, { version: 1, date: 'Jan 20, 2026', contentHtml: PRIVACY_V1 }] },
    { key: 'terms', title: 'SMS Terms & Conditions', source: 'created', versions: [
      { version: 2, date: 'Jun 3, 2026', contentHtml: TERMS_V2 }, { version: 1, date: 'Jan 20, 2026', contentHtml: TERMS_V1 }] },
  ]
  function today() { return new Date().toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }) }
  const STARTER_PRIVACY = `<h2>Privacy Policy</h2><p class="eff">Effective: [date]</p><h3>Contents</h3><ol><li>About us</li><li>What personal information we collect</li><li>How we use your personal information</li><li>Who we share it with</li><li>Your choices and opt-out</li></ol>`
  const STARTER_TERMS = `<p class="eff">[Company] · [contact email]</p><h2>Messaging Terms &amp; Conditions</h2><h3>General</h3><p>When you opt in, we'll send a message to confirm your signup.</p><p>By opting into messages, you agree to receive recurring automated marketing texts. Msg &amp; data rates may apply. Reply STOP to opt out, HELP for help.</p>`
  function starterFor(key) { return key === 'privacy' ? STARTER_PRIVACY : STARTER_TERMS }

  function ToolBtn({ onClick, children }) { return (<button type="button" onMouseDown={e => e.preventDefault()} onClick={onClick} className="flex size-[28px] items-center justify-center rounded-[7px] transition-colors hover:bg-[#f5f3f0]">{children}</button>) }

  function DocRow({ doc, onView }) {
    const current = doc.versions[0]
    if (doc.source === 'linked') {
      return (
        <a href={doc.url} target="_blank" rel="noreferrer" className="flex w-full items-center gap-[14px] rounded-[12px] border border-[#eee9e3] bg-white px-[18px] py-[15px] text-left transition-colors hover:border-[#e0d9cf] hover:bg-[#faf9f6]">
          <div className="min-w-0 flex-1"><div className="flex items-center gap-[8px]"><p className="text-[15px] font-semibold text-[#1a1a1a]">{doc.title}</p><span className="rounded-full bg-[#f1efe8] px-[8px] py-[2px] text-[10px] font-semibold uppercase tracking-[0.4px] text-[#8a8579]">Linked</span></div><p className="mt-[3px] truncate text-[13px] text-[#9c9c9c]">{doc.url}</p></div>
          <ExternalLink size={16} className="shrink-0 text-[#c4bfb6]" />
        </a>
      )
    }
    return (
      <button onClick={onView} className="group flex w-full items-center gap-[16px] rounded-[14px] border border-[#eee9e3] bg-white px-[18px] py-[16px] text-left transition-all hover:border-[#e0d9cf] hover:shadow-[0_3px_14px_rgba(31,31,31,0.05)]">
        <div className="min-w-0 flex-1"><div className="flex items-center gap-[8px]"><p className="text-[15px] font-semibold text-[#1a1a1a]">{doc.title}</p><span className="rounded-full bg-[#eaf3de] px-[8px] py-[2px] text-[10px] font-semibold uppercase tracking-[0.4px] text-[#3b6d11]">Published</span></div><p className="mt-[5px] text-[13px] text-[#9c9c9c]">Updated {current.date}</p></div>
        <span className="flex shrink-0 items-center gap-[5px] rounded-full border border-[#e8e4df] px-[13px] py-[7px] text-[12px] font-medium text-[#6b6b6b] transition-colors group-hover:border-[#1a1a1a] group-hover:text-[#1a1a1a]"><Pencil size={13} /> Manage</span>
      </button>
    )
  }

  function LegalDocDrawer({ doc, readOnly, onClose, onSave }) {
    const [editing, setEditing] = useState(null)
    const [show, setShow]       = useState(false)
    const [saved, setSaved]     = useState(false)
    const editorRef = useRef(null)
    const panelRef  = useRef(null)

    useEffect(() => { const t = window.setTimeout(() => setShow(true), 10); return () => window.clearTimeout(t) }, [])
    const close = () => { setShow(false); window.setTimeout(onClose, 260) }
    const closeRef = useRef(close); closeRef.current = close
    useEffect(() => {
      const onDown = (e) => { if (panelRef.current && !panelRef.current.contains(e.target)) closeRef.current() }
      const onKey = (e) => { if (e.key === 'Escape') closeRef.current() }
      document.addEventListener('mousedown', onDown); document.addEventListener('keydown', onKey)
      return () => { document.removeEventListener('mousedown', onDown); document.removeEventListener('keydown', onKey) }
    }, [])

    const current  = doc.versions[0]
    const expanded = editing !== null
    const exec = (cmd, val) => { editorRef.current?.focus(); document.execCommand(cmd, false, val) }
    const addLink = () => { const url = window.prompt('Link URL'); if (url) exec('createLink', url) }
    const editVersion = (v) => setEditing({ html: v.contentHtml, from: `v${v.version}` })
    const editNew     = () => setEditing({ html: starterFor(doc.key), from: 'template' })
    const handleSave = () => { const html = editorRef.current?.innerHTML ?? current.contentHtml; onSave(html); setEditing(null); setSaved(true); window.setTimeout(() => setSaved(false), 2400) }

    const renderVersions = (compact) => (
      <div className="relative flex flex-col gap-[10px]">
        {doc.versions.length > 1 && <div className="pointer-events-none absolute bottom-[32px] left-[31px] top-[32px] w-[2px] bg-[#efe9e2]" />}
        {doc.versions.map((v, i) => {
          const active = expanded && editing?.from === `v${v.version}`
          const isCurrent = i === 0
          return (
            <button key={v.version} onClick={() => editVersion(v)} className={cn('group relative flex items-center gap-[13px] rounded-[14px] border px-[14px] py-[13px] text-left transition-all', active ? 'border-[#e11d74] bg-[#fdf2f8]/60 shadow-[0_2px_12px_rgba(225,29,116,0.10)]' : 'border-[#eee9e3] bg-white hover:border-[#e0d9cf] hover:shadow-[0_2px_12px_rgba(31,31,31,0.05)]')}>
              <span className={cn('z-[1] flex size-[34px] shrink-0 items-center justify-center rounded-full text-[12px] font-bold transition-colors', isCurrent ? 'bg-[#e11d74] text-white shadow-[0_0_0_4px_#fdf2f8]' : 'bg-white text-[#6b6b6b] shadow-[0_0_0_1px_#e2ddd5]')}>v{v.version}</span>
              <span className="min-w-0 flex-1"><span className="flex items-center gap-[7px]"><span className="text-[13px] font-semibold text-[#1a1a1a]">Version {v.version}</span>{isCurrent && <span className="rounded-full bg-[#eaf3de] px-[7px] py-[1px] text-[9px] font-bold uppercase tracking-[0.4px] text-[#3b6d11]">Current</span>}</span><span className="mt-[3px] flex items-center gap-[5px] text-[12px] text-[#9a958d]"><Clock size={11} /> {isCurrent ? 'Published' : 'Archived'} · {v.date}</span></span>
              {!compact && <ChevronRight size={16} className="shrink-0 text-[#c4bfb6] transition-colors group-hover:text-[#8a8579]" />}
            </button>
          )
        })}
      </div>
    )

    return createPortal(
      <div className="fixed inset-0 z-[60]">
        <div onClick={close} className={cn('absolute inset-0 bg-black/25 transition-opacity duration-300', show ? 'opacity-100' : 'opacity-0')} />
        <div ref={panelRef} className={cn('pointer-events-auto absolute right-0 top-0 flex h-full max-w-[96vw] flex-col border-l border-[#ece7e0] bg-white shadow-[-12px_0_40px_rgba(0,0,0,0.14)] transition-[transform,width] duration-300 ease-out', expanded ? 'w-[1024px]' : 'w-[640px]', show ? 'translate-x-0' : 'translate-x-full')}>
          <div className="flex items-center gap-[10px] border-b border-[#f0ede9] bg-white px-[18px] py-[13px]">
            <button onClick={close} className="flex size-[32px] items-center justify-center rounded-[8px] text-[#1a1a1a] transition-colors hover:bg-[#f5f3f0]" aria-label="Close"><X size={20} /></button>
            <p className="flex-1 truncate text-[16px] font-bold text-[#1a1a1a]">{doc.title}</p>
            <button onClick={expanded ? () => setEditing(null) : close} className="rounded-full border border-[#e8e4df] px-[18px] py-[9px] text-[13px] font-medium text-[#444] transition-colors hover:bg-[#f9f8f7]">Cancel</button>
            {expanded && !readOnly && (<button onClick={handleSave} className="flex items-center gap-[6px] rounded-full bg-[#e11d74] px-[18px] py-[9px] text-[13px] font-semibold text-white transition-[filter] hover:brightness-95"><Check size={15} strokeWidth={2.5} /> Save new version</button>)}
          </div>

          {expanded ? (
            <div className="flex min-h-0 flex-1">
              <div className="w-[448px] shrink-0 overflow-y-auto border-r border-[#f0ede9] px-[20px] py-[18px]">
                <p className="mb-[14px] text-[16px] font-semibold leading-[24px] text-[#1a1a1a]">Versions</p>
                {renderVersions(true)}
                {!readOnly && (<button onClick={editNew} className={cn('mt-[12px] inline-flex items-center gap-[7px] rounded-[10px] px-[16px] py-[10px] text-[13px] font-semibold text-white transition-colors', editing?.from === 'template' ? 'bg-[#e11d74] hover:brightness-95' : 'bg-[#1a1a1a] hover:bg-[#333]')}><Plus size={14} /> Add new Policy</button>)}
              </div>
              <div className="flex min-w-0 flex-1 flex-col overflow-y-auto px-[24px] py-[24px]">
                <div className="mx-auto w-full max-w-[900px]">
                  <p className="mb-[12px] text-[12px] text-[#9a958d]">Editing from <span className="font-medium text-[#6b6b6b]">{editing.from === 'template' ? 'a blank template' : editing.from}</span> · saving publishes <span className="font-medium text-[#6b6b6b]">v{current.version + 1}</span> and keeps every earlier version in history.</p>
                  <div className="overflow-hidden rounded-[12px] border border-[#e8e4df] transition-shadow focus-within:border-[#1a1a1a] focus-within:ring-4 focus-within:ring-[#1f1f1f]/[0.05]">
                    <div className="flex items-center gap-[2px] border-b border-[#f0ede9] px-[10px] py-[7px] text-[#6b6b6b]">
                      <ToolBtn onClick={() => exec('bold')}><Bold size={15} /></ToolBtn>
                      <ToolBtn onClick={() => exec('italic')}><Italic size={15} /></ToolBtn>
                      <ToolBtn onClick={() => exec('underline')}><Underline size={15} /></ToolBtn>
                      <span className="mx-[6px] h-[16px] w-px bg-[#e8e4df]" />
                      <ToolBtn onClick={addLink}><Link2 size={15} /></ToolBtn>
                      <ToolBtn onClick={() => exec('insertUnorderedList')}><List size={15} /></ToolBtn>
                      <ToolBtn onClick={() => exec('insertOrderedList')}><ListOrdered size={15} /></ToolBtn>
                    </div>
                    <div key={editing.from} ref={editorRef} contentEditable suppressContentEditableWarning className="doc-content min-h-[300px] cursor-text bg-[#fcfbf9] px-[22px] py-[18px] text-[#1a1a1a] outline-none transition-colors focus:bg-white" dangerouslySetInnerHTML={{ __html: editing.html }} />
                  </div>
                  <p className="mt-[10px] flex items-center gap-[6px] text-[12px] text-[#a3a3a3]"><Pencil size={12} /> Click anywhere in the document to edit — use the toolbar to format.</p>
                </div>
              </div>
            </div>
          ) : (
            <div className="flex-1 overflow-y-auto px-[20px] py-[18px]">
              {saved && (<div className="mb-[14px] flex items-center gap-[8px] rounded-[10px] border border-[#d4e7ba] bg-[#f3f8ea] px-[14px] py-[10px] text-[12px] text-[#3b6d11]"><Check size={13} strokeWidth={3} /> New version saved</div>)}
              <p className="text-[16px] font-semibold leading-[24px] text-[#1a1a1a]">Versions</p>
              <p className="mb-[16px] mt-[6px] text-[14px] leading-[20px] text-[#9c9c9c]">Click a version to open and edit it — saving always creates a new version.</p>
              {renderVersions(false)}
              {!readOnly && (<button onClick={editNew} className="mt-[16px] inline-flex items-center gap-[7px] rounded-[10px] bg-[#1a1a1a] px-[16px] py-[10px] text-[13px] font-semibold text-white transition-colors hover:bg-[#333]"><Plus size={15} /> Add new Policy</button>)}
            </div>
          )}
        </div>
      </div>, document.body)
  }

  return function LegalDocsCard() {
    const [docs, setDocs]     = useState(INITIAL_DOCS)
    const [openKey, setOpenKey] = useState(null)
    const [mode, setMode] = useState('editable')
    const [expandedKey, setExpandedKey] = useState(null)
    const readOnly = mode === 'readonly'
    const openDoc = openKey ? docs.find(d => d.key === openKey) ?? null : null

    const addVersion = (key, contentHtml) => {
      setDocs(prev => prev.map(d => {
        if (d.key !== key) return d
        const nextVersion = (d.versions[0]?.version ?? 0) + 1
        return { ...d, versions: [{ version: nextVersion, date: today(), contentHtml }, ...d.versions] }
      }))
    }

    return (
      <div className="rounded-[16px] border border-[#f3eee8] bg-white p-[25px]">
        <div className="mb-[18px] flex items-start justify-between gap-4">
          <div className="min-w-0"><p className="text-[16px] font-semibold leading-[24px] text-[#1a1a1a]">SMS Policies &amp; Terms</p><p className="mt-[6px] text-[14px] leading-[20px] text-[#9c9c9c]">{readOnly ? 'Locked after carrier approval — to change, submit a new version for review.' : 'Edit and re-version anytime — shared with carriers and shown to your buyers.'}</p></div>
          <div className="flex shrink-0 items-center gap-[8px]">
            <span className="text-[10px] font-bold uppercase tracking-[1px] text-[#c4bfb6]">Demo</span>
            <div className="flex rounded-full bg-[#f1efe8] p-[3px]">
              {['editable', 'readonly'].map(m => (<button key={m} onClick={() => { setMode(m); setOpenKey(null); setExpandedKey(null) }} className={cn('rounded-full px-[12px] py-[5px] text-[12px] font-medium transition-colors', mode === m ? 'bg-white text-[#1a1a1a] shadow-[0_1px_2px_rgba(0,0,0,0.08)]' : 'text-[#9a958d] hover:text-[#6b6b6b]')}>{m === 'editable' ? 'Editable' : 'Read-only'}</button>))}
            </div>
          </div>
        </div>

        <div className="flex flex-col gap-[10px]">
          {docs.map(doc => {
            if (readOnly && doc.source === 'created') {
              const expanded = expandedKey === doc.key
              const original = doc.versions[doc.versions.length - 1]
              return (
                <div key={doc.key} className="overflow-hidden rounded-[12px] border border-[#eee9e3] bg-white">
                  <button onClick={() => setExpandedKey(k => (k === doc.key ? null : doc.key))} className="flex w-full items-center gap-[14px] px-[18px] py-[15px] text-left transition-colors hover:bg-[#faf9f6]">
                    <div className="min-w-0 flex-1"><div className="flex items-center gap-[8px]"><p className="text-[15px] font-semibold text-[#1a1a1a]">{doc.title}</p><span className="flex items-center gap-[3px] rounded-full bg-[#f1efe8] px-[8px] py-[2px] text-[10px] font-semibold uppercase tracking-[0.4px] text-[#8a8579]"><Lock size={9} strokeWidth={2.5} /> Approved</span></div><p className="mt-[3px] text-[13px] text-[#9c9c9c]">Approved · {original.date}</p></div>
                    <ChevronDown size={18} className={cn('shrink-0 text-[#c4bfb6] transition-transform', expanded && 'rotate-180')} />
                  </button>
                  {expanded && (<div className="border-t border-[#f0ede9]"><div className="flex items-center gap-[6px] bg-[#fdf8ec] px-[16px] py-[9px] text-[11px] font-medium text-[#8a6d1f]"><Lock size={12} /> Approved &amp; locked · to change, submit a new version for review</div><div className="doc-content max-h-[420px] overflow-y-auto px-[20px] py-[16px] text-[#1a1a1a]" dangerouslySetInnerHTML={{ __html: original.contentHtml }} /></div>)}
                </div>
              )
            }
            return <DocRow key={doc.key} doc={doc} onView={() => setOpenKey(doc.key)} />
          })}
        </div>

        {!readOnly && openDoc && (<LegalDocDrawer doc={openDoc} readOnly={false} onClose={() => setOpenKey(null)} onSave={html => addVersion(openDoc.key, html)} />)}
      </div>
    )
  }
})()

// ── AccountPage (My Account → Company tab) ────────────────────────────────────
function AccountPage() {
  const [tab, setTab] = useState('Company')
  const TABS = ['Account', 'Subscribe', 'Company', 'Payments', 'Billing History']
  return (
    <ShopcordShell active={null}>
      <div className="flex-1 px-8 py-8 lg:px-10">
        <h1 className="mb-6 text-[28px] font-bold text-[#1f1f1f]">My Account</h1>
        <div className="mb-8 inline-flex flex-wrap gap-1 rounded-[16px] border border-[#f2ede7] bg-[#fefefd] p-1">
          {TABS.map(t => (
            <button key={t} onClick={() => setTab(t)} className={cn('rounded-[8px] px-[24px] py-[13px] text-[14px] font-medium transition-colors', tab === t ? 'bg-[#fdf2f8]/60 text-[#e11d74]' : 'text-[#1f1f1f] hover:bg-black/[0.03]')}>{t}</button>
          ))}
        </div>

        {tab === 'Company' ? (
          <div className="max-w-[900px] space-y-4">
            <div className="rounded-[16px] border border-[#f3eee8] bg-white p-[25px]">
              <div className="mb-[16px] flex items-center gap-2"><p className="text-[16px] font-semibold leading-[24px] text-[#1a1a1a]">Company</p><Pencil size={16} className="text-[#c4bfb6]" /></div>
              <div className="grid grid-cols-2 gap-x-6 gap-y-[16px]">
                <CompanyField label="Legal Entity" value="NHN Global" />
                <CompanyField label="Email" value="emma.carter@fashiongo.net" />
                <CompanyField label="Brand (DBA)" value="FASHIONGO" />
                <CompanyField label="Billing Address" value="2110 E 24th St, Los Angeles, CA 90058" />
                <CompanyField label="Website" value="https://www.fashiongo.net" />
                <CompanyField label="Phone" value="+1 (213) 123-1234" />
              </div>
            </div>
            <LegalDocsCard />
          </div>
        ) : (
          <div className="max-w-[900px] rounded-[16px] border border-[#f3eee8] bg-white p-[40px] text-center text-[14px] text-[#9c9c9c]">
            The <span className="font-semibold text-[#1a1a1a]">{tab}</span> tab is out of scope for this prototype. Only the <span className="font-semibold text-[#e11d74]">Company</span> tab (SMS Policies &amp; Terms manager) is reproduced here.
          </div>
        )}
      </div>
    </ShopcordShell>
  )
}
function CompanyField({ label, value }) {
  return (<div className="min-w-0"><p className="mb-1 text-[14px] font-normal leading-[20px] text-[#9c9c9c]">{label}</p><p className="text-[14px] leading-[20px] text-[#1a1a1a]">{value}</p></div>)
}

// ── Landing menu + Demo nav + App ─────────────────────────────────────────────
const VARIANTS = [
  { id: 'toss', emoji: '💬', name: 'Toss style', desc: 'One question per screen · progress bar · centered pink pill' },
  { id: 'mailchimp', emoji: '🗂️', name: 'Mailchimp style', desc: 'Full-screen wizard · top breadcrumb · right phone preview' },
  { id: 'hybrid', emoji: '🧬', name: 'Hybrid style', desc: 'Toss + Mailchimp best-of · sidebar + live preview' },
  { id: 'account', emoji: '⚙️', name: 'My Account · SMS Policies & Terms', desc: 'Editable version drawer vs Read-only locked (DEMO toggle)' },
]

function Menu({ onPick }) {
  return (
    <div className="min-h-screen bg-[#fdfcfa] font-sans text-[#1f1f1f]">
      <div className="mx-auto flex min-h-screen max-w-[760px] flex-col justify-center px-6 py-16">
        <div className="mb-8"><ShopcordLogo /></div>
        <p className="mb-2 text-[13px] font-semibold uppercase tracking-[1px] text-[#c9a2b7]">Prototype · Phase 2.5</p>
        <h1 className="mb-2 text-[32px] font-bold leading-[1.15] tracking-[-0.5px] text-[#1f1f1f]">SMS Marketing Onboarding</h1>
        <p className="mb-8 text-[15px] leading-[1.6] text-[#6b6b6b]">Three interactive onboarding variants for Shopcord vendors, plus the My Account policy manager. Everything below is fully clickable — step through a wizard, edit the policy templates, or switch between them anytime with the floating <span className="font-semibold text-[#e11d74]">DEMO</span> button.</p>
        <div className="grid gap-3 sm:grid-cols-2">
          {VARIANTS.map(v => (
            <button key={v.id} onClick={() => onPick(v.id)} className="flex flex-col items-start gap-1 rounded-2xl border border-[#e4e4e7] bg-white p-5 text-left transition-all hover:border-[#e11d74] hover:shadow-[0_6px_24px_-10px_rgba(225,29,116,0.4)]">
              <span className="mb-1 text-[26px]">{v.emoji}</span>
              <span className="text-[16px] font-semibold text-[#1f1f1f]">{v.name}</span>
              <span className="text-[13px] leading-[1.5] text-[#a3a3a3]">{v.desc}</span>
            </button>
          ))}
        </div>
      </div>
    </div>
  )
}

function DemoNav({ view, onPick }) {
  const [open, setOpen] = useState(false)
  return (
    <div className="fixed bottom-6 right-6 z-[90] font-sans">
      {open && (
        <div className="mb-3 w-[300px] overflow-hidden rounded-2xl border border-[#e4e4e7] bg-white shadow-[0_20px_50px_-15px_rgba(0,0,0,0.28)]">
          <div className="border-b border-[#f2ede7] px-4 py-3"><p className="text-[11px] font-bold uppercase tracking-[1px] text-[#c4bfb6]">Demo · switch view</p></div>
          <div className="flex flex-col p-1.5">
            <button onClick={() => { onPick('menu'); setOpen(false) }} className={cn('rounded-xl px-3 py-2.5 text-left text-[13px] font-medium transition-colors', view === 'menu' ? 'bg-[#fdf2f8]/70 text-[#e11d74]' : 'text-[#6b6b6b] hover:bg-black/[0.03]')}>🏠 Home menu</button>
            {VARIANTS.map(v => (
              <button key={v.id} onClick={() => { onPick(v.id); setOpen(false) }} className={cn('rounded-xl px-3 py-2.5 text-left text-[13px] font-medium transition-colors', view === v.id ? 'bg-[#fdf2f8]/70 text-[#e11d74]' : 'text-[#6b6b6b] hover:bg-black/[0.03]')}>{v.emoji} {v.name}</button>
            ))}
          </div>
        </div>
      )}
      <button onClick={() => setOpen(o => !o)} className="flex h-12 items-center gap-2 rounded-full bg-[#1f1f1f] px-5 text-[13px] font-bold uppercase tracking-[1px] text-white shadow-[0_12px_30px_-8px_rgba(0,0,0,0.5)] transition-transform hover:scale-105">
        <span className="size-1.5 rounded-full bg-[#e11d74]" /> Demo
      </button>
    </div>
  )
}

function App() {
  const [view, setView] = useState('menu')
  return (
    <RouteCtx.Provider value={setView}>
      {view === 'menu' && <Menu onPick={setView} />}
      {view === 'toss' && <SmsOnboardingTossPage />}
      {view === 'mailchimp' && <SmsOnboardingMailchimpPage />}
      {view === 'hybrid' && <SmsOnboardingHybridPage />}
      {view === 'account' && <AccountPage />}
      <DemoNav view={view} onPick={setView} />
    </RouteCtx.Provider>
  )
}

createRoot(document.getElementById('root')).render(<App />)
</script>
</body>
</html>
